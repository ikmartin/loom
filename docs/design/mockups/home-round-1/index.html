<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loom · home page mock-up, round one</title>
<style>
:root{
  --paper:#fbfaf8;--leaf:#f4f2ed;--sheet:#fff;--rule:#d8d5cd;--rule-soft:#ebe8e1;--stripe:#f5f3ee;
  --ink:#2c2c2a;--grey:#7b7972;
  --link:#185fa5;--sel:#e3eefa;
  --accent:#d97757;--float-shadow:0 6px 24px rgb(0 0 0/12%);
  --green:#0f6e56;--amber:#a0620e;--problem:#a32d2d;
  --serif:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --wash-ink:color-mix(in srgb,var(--ink) 6%,transparent);
  --s:11px;--m:13px;--l:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141416}
body{font-family:var(--sans);font-size:var(--m);line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

/* ===== the strip: outside the mocked application ===== */
#strip{position:fixed;top:0;left:0;right:0;height:30px;background:#141416;color:#c9c7c0;display:flex;align-items:center;gap:5px;padding:0 8px;font:11px/1 var(--mono);z-index:1000;border-bottom:2px solid #e0b84a}
#strip .tag{background:#e0b84a;color:#141416;padding:4px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#strip nav{display:flex;gap:1px;align-items:center}
#strip nav button{background:none;border:1px solid transparent;color:#c9c7c0;padding:4px 5px;border-radius:4px;cursor:pointer;font:11px/1 var(--mono);white-space:nowrap}
#strip nav button:hover{border-color:#44444a}
#strip nav button.on{background:#e0b84a;color:#141416}
#strip nav .gap{width:10px}
#strip .cap{margin-left:auto;color:#e0b84a;white-space:nowrap;padding-right:4px}

/* ===== frame ===== */
#app{position:fixed;top:30px;left:0;right:0;bottom:0;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--grey);cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--wash-ink);color:var(--ink)}
.btn{font-size:var(--m);line-height:1.3;padding:4px 11px;border-radius:7px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--sel)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){background:#4a4a46}
.btn.quiet{background:transparent;border-color:transparent;color:var(--grey)}
.btn.quiet:hover:not(:disabled){background:var(--wash-ink);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{all:unset;color:var(--link);cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.grey{color:var(--grey)}
.small{font-size:var(--s)}
.mono{font-family:var(--mono)}

/* ===== the home page ===== */
.home{flex:1;min-height:0;overflow:auto}
.hwrap{width:880px;margin:0 auto;padding:44px 0 40px}
.hhead{display:flex;align-items:center;gap:8px;margin:0 0 18px}
.hhead h1{font-size:var(--l);font-weight:500;margin:0 auto 0 0}
.hnote{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:8px;padding:8px 8px 8px 12px;margin:0 0 14px;background:var(--sheet)}
.hnote.bad{border-left-color:var(--problem)}
.hnote.plain{border-left-color:var(--rule)}
.hnote .t{flex:1}
.hnote .lines{font-size:var(--s);color:var(--grey);margin-top:3px;line-height:1.6}
.namecard{border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:14px 16px;margin:0 0 18px}
.namecard label{display:block;margin:0 0 8px}
.namecard .r{display:flex;gap:8px}
.field{border:1px solid var(--rule);border-radius:7px;padding:4px 9px;background:var(--sheet);width:320px;height:28px}
.field:focus{outline:2px solid var(--sel);border-color:#9bb8d8}
.field.err{border-color:var(--problem);outline:2px solid rgb(163 45 45/12%)}

.qlist{border-top:1px solid var(--rule)}
.qrow{display:grid;grid-template-columns:300px 1fr auto;align-items:start;gap:20px;padding:12px 6px 12px 4px;border-bottom:1px solid var(--rule-soft);min-height:58px}
.qn{display:flex;gap:10px;align-items:flex-start;min-width:0}
.qn .nm{font-weight:500}
.qn .fd{font-size:var(--s);color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;border:1.5px solid var(--grey);background:none}
.st.running{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgb(15 110 86/14%)}
.st.starting{border-color:var(--amber);border-style:dashed}
.st.failed{background:var(--problem);border-color:var(--problem)}
.st.missing{border:0;width:10px;height:10px;margin-top:1px;color:var(--grey);font-size:14px;line-height:14px;text-align:center}
.st.missing::before{content:"?"}
.qs{padding-top:2px;min-width:0}
.qs .w{color:var(--ink)}
.qs .w.soft{color:var(--grey)}
.qs .sub{font-size:var(--s);color:var(--grey);margin-top:2px}
.qc{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding-top:0;min-width:200px}
.logbox{font:12px/1.5 var(--mono);background:var(--leaf);border:1px solid var(--rule-soft);border-radius:6px;padding:5px 9px;margin:4px 0 4px;white-space:pre-wrap;word-break:break-word;color:#3d3c39}
.copy{font-size:var(--s);padding:2px 9px;margin-top:2px}
.copy.done{display:inline-block;padding:3px 0}
.copy.done{color:var(--green)}
.drophint{margin:14px 4px 0;font-size:var(--s);color:var(--grey)}
.empty{border:1.5px dashed #c6c2b8;border-radius:12px;padding:40px 44px;text-align:center;margin:6px 0 0;background:var(--sheet)}
.empty h2{font-size:var(--l);font-weight:500;margin:0 0 8px}
.empty p{margin:0 auto 6px;max-width:640px}
.empty .what{margin-top:18px;color:var(--grey);font-size:var(--s)}
.hfoot{flex:none;height:36px;border-top:1px solid var(--rule);background:var(--leaf);display:flex;align-items:center;gap:8px;padding:0 16px;font-size:var(--s);color:var(--grey)}
.hfoot .who{color:var(--ink)}
.hfoot .field{width:220px;height:24px;padding:2px 8px;font-size:var(--s)}
.hfoot .btn{font-size:var(--s);padding:2px 9px}

/* ===== the drop cover and the drop window ===== */
.dragcover{position:fixed;top:30px;left:0;right:0;bottom:0;z-index:300;background:rgb(244 242 237/82%);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center}
.dragcover div{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--float-shadow);padding:16px 24px;font-size:var(--l)}
.scrim{position:fixed;top:30px;left:0;right:0;bottom:0;z-index:200;background:rgb(44 44 42/18%);display:flex;align-items:flex-start;justify-content:center;padding-top:120px}
.win{width:560px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgb(0 0 0/18%)}
.win .wh{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 20px;border-bottom:1px solid var(--rule-soft)}
.win .wh b{font-weight:500;font-size:var(--l);margin-right:auto}
.win .wb{padding:16px 20px 6px}
.win .wf{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 20px 16px}
.win .wf .l{margin-right:auto}
.dropped{display:flex;align-items:center;gap:8px;color:var(--grey);margin:0 0 16px}
.dropped b{color:var(--ink);font-weight:500}
.frm{display:grid;grid-template-columns:70px 1fr;gap:10px 12px;align-items:center}
.frm .lab{color:var(--grey)}
.frm .field{width:100%}
.frm .err{grid-column:2;color:var(--problem);margin-top:-4px}
.choices{margin:8px 0 4px}
.choice{display:flex;align-items:center;gap:10px;min-height:30px;padding:0 8px;border-radius:6px;cursor:pointer}
.choice:hover{background:var(--wash-ink)}
.choice input{margin:0;accent-color:var(--ink)}
.choice .p{font-family:var(--mono);font-size:12.5px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:5px 0}
.steps li.todo{color:var(--grey)}
.steps li .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.steps li .sub{display:block;font-size:var(--s);color:var(--grey)}
.spin{animation:spin 1.1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.said{border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:8px;padding:8px 12px;margin:0 0 4px}
.said.bad{border-left-color:var(--problem)}
.ready{margin:0 0 4px;font-weight:500}

/* ===== a quilt's page (section 6 only) ===== */
.qapp{flex:1;display:flex;min-height:0;position:relative}
.col{width:252px;flex:none;background:var(--leaf);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:12px 14px 0;position:relative}
.col-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.col-head .qname{font-weight:500;margin-right:auto}
.views{display:flex;gap:16px;border-bottom:1px solid var(--rule);margin:0 0 12px}
.views a{padding:4px 0 6px;color:var(--grey);margin-bottom:-1px}
.views a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.views a:hover{text-decoration:none;color:var(--ink)}
.fhead{display:flex;align-items:center;font-size:12px;font-weight:500;padding:3px 6px;border-bottom:1px solid var(--rule)}
ul.ftree{list-style:none;margin:0;padding:4px 6px 0 4px}
ul.ftree ul{list-style:none;margin:0 0 0 .55rem;padding:0 0 0 .5rem;border-left:1px solid var(--rule)}
ul.ftree li{margin:2px 0;font-size:12px;line-height:1.4}
ul.ftree .fold{color:#5f5e5a}
ul.ftree a.here{color:var(--ink);font-weight:600}
ul.ftree a.other{color:#5f5e5a}
ul.ftree .pdfrow{margin:2px 0 2px 12px}
ul.ftree .pdfrow a{color:#5f5e5a}
.msg{margin:0 0 12px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 8px 8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;line-height:1.4}
.msg .t{flex:1 1 100%}
.msg .u{display:flex;gap:10px;align-items:center;width:100%;justify-content:flex-end}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.tabs{height:32px;flex:none;display:flex;background:#efede8;border-bottom:1px solid var(--rule)}
.tab{display:flex;align-items:center;gap:10px;padding:0 12px;min-width:110px;color:var(--grey);border-right:1px solid var(--rule);white-space:nowrap;margin-bottom:-1px}
.tab.on{background:var(--paper);color:var(--ink)}
.docw{flex:1;overflow:auto}
.page{width:760px;margin:0 auto;padding:36px 0 60px;font-family:var(--serif);font-size:15px;line-height:1.6}
.page h1{font-weight:400;font-size:24px;text-align:center;margin:10px 0 4px}
.page .au{text-align:center;margin:0 0 22px}
.page h2{font-weight:400;font-size:18px;margin:26px 0 8px}
.page .abs{font-size:14px;margin:0 40px 18px}
.page .thm{margin:14px 0}
.page .thm b{font-weight:700}
.qnote{display:flex;gap:10px;align-items:center;font-family:var(--sans);font-size:var(--m);border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:8px;padding:6px 6px 6px 12px;margin:0 0 14px;background:var(--sheet);line-height:1.45}
.qnote .t{flex:1}
.stopcover{position:absolute;inset:0;background:rgb(251 250 248/78%);display:flex;align-items:flex-start;justify-content:center;padding-top:150px;z-index:20}
.stopcover .card{width:470px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--float-shadow);padding:16px 20px}
.stopcover .card p{margin:0 0 10px}
</style>
</head>
<body>
<header id="strip"></header>
<div id="app"></div>
<script>
/* ================= helpers ================= */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const IC = {
 close:`<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
 gear:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v2.1M8 12.3v2.1M1.6 8h2.1M12.3 8h2.1M3.5 3.5l1.5 1.5M11 11l1.5 1.5M3.5 12.5 5 11M11 5l1.5-1.5"/></svg>`,
 collapse:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 4 4.5 8l4 4M12.5 4l-4 4 4 4"/></svg>`,
 tick:`<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="var(--green)"/><path d="M4.6 8.2l2.3 2.4 4.5-4.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 todo:`<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--rule)" stroke-width="1.5"/></svg>`,
 spin:`<svg class="spin" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="var(--rule)" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 6.5 6.5" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/></svg>`,
 folder:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3.2l1.4 1.6H13c.7 0 1.2.5 1.2 1.2v6.2c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z"/></svg>`,
 file:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5.2h3.5"/></svg>`
};
const xbtn = (title='close') => `<button class="ib" title="${title}" data-go="back">${IC.close}</button>`;

/* ================= fixtures (invented) ================= */
const PERSON = 'Maren Holt';
const Q = {
  cycle:   {name:'Cycle spaces', folder:'~/Quilts/cycle-spaces'},
  gadget:  {name:'gadget-towers', folder:'~/Quilts/gadget-towers'},
  thesis:  {name:'Thesis', folder:'~/Documents/thesis'},
  reading: {name:'Reading: flow polytopes', folder:'~/Quilts/reading-flow-polytopes'},
  knots:   {name:'Knot invariants', folder:'~/Quilts/knot-invariants'},
  median:  {name:'Median orders', folder:'~/Quilts/median-orders'},
  cover:   {name:'Covering estimates', folder:'~/Quilts/covering-estimates'},
  widget:  {name:'Widget categories', folder:'~/Quilts/widget-categories'},
  flow:    {name:'Flow polytopes', folder:'~/Quilts/flow-polytopes'},
  lattice: {name:'Lattice points', folder:'~/Dropbox/lattice-points'},
};
const copyBtn = (done=false) => done
  ? `<span class="copy done">Copied</span>`
  : `<button class="btn copy" data-copy title="Copies a report on loom and this machine, with the quilt's last lines of output, for whoever helps you">Copy details</button>`;

/* one row of the list; state words and controls as the hand-over gives them */
function row(q, state, o={}){
  let dot = state, words = '', controls = '';
  switch(state){
    case 'running':  words = `<span class="w">Running</span>`;
      controls = `<button class="btn" title="Opens it in its own tab">Open</button><button class="btn" title="Stops serving it; its folder is untouched">Stop</button>`; break;
    case 'starting': words = `<span class="w soft">Starting…</span>`; break;
    case 'stopped':  words = `<span class="w soft">Not running</span>`;
      controls = `<button class="btn" title="Starts it and opens it in its own tab">Open</button>${forget()}`; break;
    case 'missing':  words = `<span class="w">Its folder is not where it was</span>`;
      controls = forget(); break;
    case 'port-taken': dot='failed'; words = `<span class="w">Another program is using its address</span>`;
      controls = `<div style="text-align:right"><button class="btn">Move to a new address</button><div class="small grey" style="margin-top:3px">Its layout and preferences start afresh there.</div></div>`; break;
    case 'refused': dot='failed'; words = `<span class="w">Loom could not open it:</span><div class="logbox">${esc(o.said)}</div>${copyBtn(o.copied)}${o.hint?`<div class="sub">${o.hint}</div>`:''}`;
      controls = o.newer ? forget() : `<button class="btn">Open again</button>${forget()}`; break;
    case 'exited': dot='failed'; words = `<span class="w">It stopped by itself three times</span><div>${copyBtn(o.copied)}</div>`;
      controls = `<button class="btn">Open again</button>`; break;
    case 'cannot-start': dot='failed'; words = `<span class="w">Loom could not start it:</span><div class="logbox">${esc(o.said)}</div>${copyBtn(o.copied)}`;
      controls = `<button class="btn">Open again</button>${forget()}`; break;
  }
  return `<div class="qrow">
    <div class="qn"><span class="st ${dot}"></span><div style="min-width:0"><div class="nm">${esc(q.name)}</div><div class="fd">${esc(q.folder)}</div></div></div>
    <div class="qs">${words}</div>
    <div class="qc">${controls}</div>
  </div>`;
}
const forget = () => `<button class="btn" title="Takes it off this list; its folder stays where it is">Forget</button>`;

/* the page around the list */
function home({body, name='git', tex='loom', note='', disabled=false, foot}={}){
  const namecard = name===''
    ? `<div class="namecard"><label>Your name, as it appears beside your comments and decisions</label><div class="r"><input class="field" placeholder="Your name"><button class="btn primary">Save</button></div></div>` : '';
  const texnote = tex==='none'
    ? `<div class="hnote"><div class="t">Loom has no TeX yet: papers show as their source.</div><button class="btn">Repair TeX</button></div>`
    : tex==='repairing'
    ? `<div class="hnote plain"><span style="display:flex">${IC.spin}</span><div class="t">Repairing TeX<div class="lines">Fetching TeX Live 2026 for loom: 412 of 1,180 MB</div></div></div>`
    : '';
  const footer = foot ?? (name===''
    ? ''
    : name==='edit'
    ? `<span>Your name</span><input class="field" value="${PERSON}"><button class="btn primary">Save</button><button class="btn quiet" data-go="1b">Cancel</button>`
    : `<span>Your name: <span class="who">${PERSON}</span>${name==='git'?', from git':''}</span><span>·</span><button class="linkbtn" data-go="1d">Change</button>`);
  return `<div class="home"><div class="hwrap">
    <div class="hhead"><h1>Your quilts</h1><button class="btn" ${disabled?'disabled':''} data-go="5b">Open a quilt…</button><button class="btn primary" ${disabled?'disabled':''} data-go="5">New quilt</button></div>
    ${note}${namecard}${texnote}${body}
  </div></div>${footer?`<footer class="hfoot">${footer}</footer>`:''}`;
}
const emptyList = () => `<div class="empty">
  <h2>Drop your paper here</h2>
  <p>Its <span class="mono">.tex</span> file, its folder, or its source archive becomes a new quilt, open on your paper.</p>
  <p>A PDF becomes a new quilt for reading it.</p>
  <p class="what">A quilt is a folder for one piece of research: the papers you write or read, and your notes on them.</p>
</div>`;
const hint = `<p class="drophint">Drop a paper anywhere on this page to make a new quilt from it: its <span class="mono">.tex</span> file, its folder or its source archive, or a PDF to read.</p>`;
const usualList = (extra='') => `<div class="qlist">${extra}${row(Q.cycle,'running')}${row(Q.reading,'stopped')}${row(Q.thesis,'starting')}</div>${hint}`;
const listAfterDrop = () => `<div class="qlist">${row(Q.cycle,'running')}${row(Q.gadget,'running')}${row(Q.reading,'stopped')}${row(Q.thesis,'starting')}</div>${hint}`;

/* the drop window */
function win({title='New quilt from your paper', body, foot, close=true}){
  return `<div class="scrim"><div class="win">
    <div class="wh"><b>${title}</b>${close?xbtn():''}</div>
    <div class="wb">${body}</div>
    <div class="wf">${foot}</div>
  </div></div>`;
}
const droppedFolder = `<div class="dropped">${IC.folder}<span>You dropped <b>gadget-towers</b>, a folder of 14 files.</span></div>`;
const droppedArchive = `<div class="dropped">${IC.file}<span>You dropped <b>arXiv-2104.01234v2.tar.gz</b>.</span></div>`;
const droppedPdf = `<div class="dropped">${IC.file}<span>You dropped <b>okafor-2022.pdf</b>.</span></div>`;
function form({name='gadget-towers', err='', place='~/Quilts'}={}){
  return `<div class="frm">
    <span class="lab">Name</span><input class="field${err?' err':''}" value="${esc(name)}">
    ${err?`<span class="err">${err}</span>`:''}
    <span class="lab">Folder</span><span>In ${place} <button class="linkbtn" style="margin-left:6px" title="Choose where the new quilt's folder goes">Change…</button></span>
  </div>`;
}
const formFoot = `<button class="btn quiet" data-go="back">Cancel</button><button class="btn primary" data-go="2e">Create</button>`;
const WARN = `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.2" fill="var(--amber)"/><path d="M8 4.2v4.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.4" r="1" fill="#fff"/></svg>`;
function steps(at, warn=-1, warnSub=''){ // at: 0,1,2 the step running; 3 all done; warn: a done step that did not wholly happen
  const S = [
    ['Making the quilt'],
    ['Bringing your paper in and typesetting it', 'The first time can take a few minutes.'],
    ['Opening it'],
  ];
  return `<ul class="steps">${S.map(([t,sub],i)=>{
    const st = i<at?'done':i===at?'now':'todo';
    const ic = i===warn?WARN:st==='done'?IC.tick:st==='now'?IC.spin:IC.todo;
    const sb = i===warn?warnSub:(sub&&st!=='done'?sub:'');
    return `<li class="${st==='todo'?'todo':''}"><span class="ic">${ic}</span><span>${t}${sb?`<span class="sub">${sb}</span>`:''}</span></li>`;
  }).join('')}</ul>`;
}
const refusal = (text, more='') => win({
  body: `${droppedFolder}<div class="said bad">${text}${more}</div>`,
  foot: `<button class="btn" data-go="back">Close</button>`});

/* a quilt's own page, for section 6 */
function quilt({note='', overlay='', toast=''}={}){
  return `<div class="qapp">
    <aside class="col">
      <div class="col-head"><span class="qname">gadget-towers</span><button class="ib" title="settings">${IC.gear}</button><button class="ib" title="fold the column">${IC.collapse}</button></div>
      <nav class="views"><a class="on">Docs</a><a>Library</a><a>Web</a><a>Review</a></nav>
      <div class="fhead">Files</div>
      <ul class="ftree"><li><span class="fold">▾ paper</span><ul><li><a class="here">paper.tex</a></li><li class="pdfrow"><a>paper.pdf</a></li></ul></li><li><a class="other">config.toml</a></li></ul>
      <div style="flex:1"></div>
      ${toast}
    </aside>
    <section class="main">
      <div class="tabs"><div class="tab on">paper.tex</div></div>
      <div class="docw"><div class="page">
        ${note}
        <h1>Gadget towers</h1>
        <div class="au">Maren Holt</div>
        <p class="abs"><i>Abstract.</i> We show that every bounded gadget tower over a finite quiver admits a median order, and that the number of such orders is controlled by the cycle space of the quiver.</p>
        <h2>1&nbsp;&nbsp;Introduction</h2>
        <p>Gadget towers were introduced by Halberd and Ravel as a combinatorial model for the extension problems of widget categories. In this note we answer a question left open there.</p>
        <p class="thm"><b>Theorem 1.1.</b> <i>Let Q be a finite acyclic quiver and T a bounded gadget tower over Q. Then T admits a median order, and the number of median orders of T is at most 2<sup>b(Q)</sup>, where b(Q) is the rank of the cycle space of Q.</i></p>
        <p>The bound is sharp: equality holds for every tower whose gadgets are balanced.</p>
      </div></div>
    </section>
    ${overlay}
  </div>`;
}

/* ================= the strip and routing ================= */
let current = null, previous = '3';
function draw(id){
  const s = SCREENS.find(x=>x.id===id) || SCREENS[0];
  if(current && current.id!==s.id) previous = current.id;
  current = s;
  document.getElementById('app').innerHTML = s.render();
  let last = 0;
  document.querySelector('#strip').innerHTML = `<span class="tag">HOME 1</span><nav>${SCREENS.map(x=>{
    const gap = x.group!==last && last ? '<span class="gap"></span>' : ''; last = x.group;
    return `${gap}<button class="${x.id===s.id?'on':''}" data-go="${x.id}" title="${esc(x.label)}">${x.id}</button>`;
  }).join('')}</nav><span class="cap">${s.id} · ${esc(s.label)}</span>`;
  if(location.hash.slice(1)!==s.id) history.replaceState(null,'','#'+s.id);
  document.title = `Loom · ${s.id} ${s.label}`;
}
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ e.preventDefault(); const t = go.dataset.go; draw(t==='back' ? (['2','2b','2c','2d','2e','2f','2g','2h','2i','4a','4b','4c','4d','4e','4f','4g','5','5b'].includes(current.id) ? '3' : previous) : t); return; }
  const c = e.target.closest('[data-copy]');
  if(c){ c.outerHTML = copyBtn(true); }
});
document.addEventListener('change', e=>{
  if(e.target.name==='m'){ const b = document.querySelector('.win .btn.primary'); b.disabled = false; b.removeAttribute('title'); b.dataset.go = '2e'; }
});
window.addEventListener('hashchange', ()=>draw(location.hash.slice(1)));
draw(location.hash.slice(1) || '1');
</script>
