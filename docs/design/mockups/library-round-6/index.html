<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>loom · library mock-up, round three</title>
<style>
:root{
  --paper:#fbfaf8;--leaf:#f4f2ed;--sheet:#fff;--rule:#d8d5cd;--rule-soft:#ebe8e1;--stripe:#f5f3ee;
  --ink:#2c2c2a;--grey:#7b7972;
  --link:#185fa5;--sel:#e3eefa;
  --accent:#d97757;--agent:#b5532e;--float-shadow:0 6px 24px rgb(0 0 0/12%);
  --green:#0f6e56;--amber:#a0620e;--problem:#a32d2d;
  --change:rgb(0 118 118);--change-wash:rgb(0 118 118/10%);
  --serif:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tex:'Latin Modern Roman','CMU Serif','STIX Two Text',STIXGeneral,'Times New Roman',serif;
  --taxon-result:#3f5c91;--taxon-definition:#2f6f6a;
  --wash-ink:color-mix(in srgb,var(--ink) 6%,transparent);
  /* the interface's three sizes; mathematics (15px serif), Lean (12px mono) and the pages keep their own */
  --s:11px;--m:13px;--l:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141416}
body{font-family:var(--sans);font-size:var(--m);line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

/* ===== the strip: outside the mocked application ===== */
#strip{position:fixed;top:0;left:0;right:0;height:30px;background:#141416;color:#c9c7c0;display:flex;align-items:center;gap:5px;padding:0 8px;font:11px/1 var(--mono);z-index:1000;border-bottom:2px solid #e0b84a}
#strip .tag{background:#e0b84a;color:#141416;padding:4px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em}
#strip nav{display:flex;gap:1px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#strip nav button,#strip .nb{background:none;border:1px solid transparent;color:#c9c7c0;padding:4px 4px;border-radius:4px;cursor:pointer;font:11px/1 var(--mono);white-space:nowrap}
#strip nav button{flex:none}
#strip nav button:hover,#strip .nb:hover{border-color:#44444a}
#strip nav button.on{background:#e0b84a;color:#141416}
#strip .nb.on{background:#c9c7c0;color:#141416}
#notes{position:fixed;top:30px;right:0;bottom:0;width:480px;background:#1c1c1f;color:#dcdad3;z-index:999;overflow:auto;padding:18px 22px 40px;font:12.5px/1.55 var(--sans);box-shadow:-8px 0 30px rgb(0 0 0/40%);border-left:2px solid #e0b84a}
#notes[hidden]{display:none}
#notes h2{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#e0b84a;margin:18px 0 8px}
#notes h1{font:600 15px/1.3 var(--sans);margin:0 0 4px;color:#fff}
#notes ul,#notes ol{margin:0;padding-left:18px}
#notes li{margin:0 0 7px}
#notes code{font:11.5px var(--mono);background:#2c2c31;padding:0 4px;border-radius:3px;color:#f0e6c8}
#notes .x{float:right;background:none;border:0;color:#aaa;font-size:16px;cursor:pointer}

/* ===== frame ===== */
#app{position:fixed;top:30px;left:0;right:0;bottom:0;background:var(--paper);display:flex;overflow:hidden}
.col{width:252px;flex:none;background:var(--leaf);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:12px 14px 0;height:100%;position:relative;z-index:6}
.col-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.col-head .qname{font-weight:500;margin-right:auto}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--grey);cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--wash-ink);color:var(--ink)}
.viewtip{position:fixed;top:96px;z-index:90;width:300px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--float-shadow);padding:10px 12px;color:var(--ink);line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;display:inline-block;box-shadow:0 0 0 3px rgb(15 110 86/14%)}
.agentrow{cursor:pointer;white-space:nowrap}
.agentrow>span:nth-child(2){overflow:hidden;text-overflow:ellipsis}
.agentrow:hover{background:var(--wash-ink)}
.agentpop{position:absolute;left:12px;bottom:46px;width:300px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--float-shadow);padding:12px 14px;z-index:70;color:var(--ink);font-size:var(--m)}
.agentpop hr{border:0;border-top:1px solid var(--rule-soft);margin:10px 0}
.msg{margin:0 12px 6px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 8px 7px 10px;display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:var(--m);line-height:1.4}
.msg{flex-wrap:wrap}
.msg .t{flex:1 1 100%}
.msg .u{display:flex;gap:10px;align-items:center;width:100%;justify-content:flex-end}
.dragcover{position:fixed;top:30px;left:0;right:0;bottom:0;z-index:300;background:rgb(244 242 237/82%);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;pointer-events:none}
.dragcover div p{margin:0}
.dragcover div p+p{color:var(--grey);margin-top:4px}
.dragcover div{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--float-shadow);padding:14px 20px;font-size:var(--m)}
.aimark{margin-left:.4em;padding:0 3px;border-radius:3px;font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.02em;line-height:13px;vertical-align:1px;color:var(--agent)}
.aimark.off{color:var(--grey);background:linear-gradient(to top right,transparent calc(50% - .6px),currentColor calc(50% - .6px),currentColor calc(50% + .6px),transparent calc(50% + .6px)) center/72% 78% no-repeat}
.nocompile{font-family:var(--sans);font-size:var(--m);color:var(--ink);border-left:3px solid var(--problem);padding:6px 10px;margin:0 0 18px;background:#fbf3f2}
.notes-bar{display:flex;align-items:center;gap:14px;margin:0 0 14px;font-size:var(--m);color:var(--grey)}
.notes-bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.notes-bar input{margin:0;accent-color:var(--ink)}
.note .where{font-size:var(--s);color:var(--grey)}
.rtabs{overflow-x:auto;scrollbar-width:none}
.wdoc{display:flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 8px;cursor:pointer;font-weight:500}
.wdoc:hover{background:#eeebe4}
.wdoc .n{margin-left:auto;font-weight:400;color:var(--grey);font-size:var(--s)}
.wdoc .au{font-weight:400;color:var(--grey);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl.in{padding-left:40px}
.wl .pick{margin-left:8px}
.wlhit{padding:0 16px 6px 62px;font-family:var(--serif);font-size:13.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wlhit mark{background:rgb(255 235 60/60%);color:var(--ink)}
.wl-group{font-size:var(--s);color:var(--grey);padding:12px 16px 4px}
.seg button{white-space:nowrap}
.wlist-bar .small{white-space:nowrap}
.fzbig{position:absolute;inset:14px 22px;z-index:65;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgb(0 0 0/18%);display:flex;flex-direction:column}
.fzbig .fzb{flex:1;overflow:auto;padding:18px 28px 28px}
.fzbig .lead{font-size:15px;margin:14px 0 16px;color:var(--ink)}
.fzbig h4{font-size:var(--m);font-weight:500;margin:18px 0 4px;display:flex;align-items:center;gap:6px}
.fzbig h4 .n{color:var(--grey);font-weight:400}
.fzbig .need{border:1px solid var(--rule);border-left:3px solid var(--amber);border-radius:8px;padding:8px 12px;margin:6px 0}
.fzbig .need.block{border-left-color:var(--problem)}
.fzbig .need .w{font-size:var(--s);color:var(--grey)}
.fzi{display:flex;align-items:center;gap:6px;min-height:30px;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.fzi:hover{background:#f7f5f1}
.fzi .seg{margin-left:auto}
.fzi .fznote{margin-left:auto;font-size:var(--s);color:var(--grey);white-space:nowrap}
.fzst{padding:4px 0 10px 50px}
.fzbtn{display:flex;align-items:center;gap:14px;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.fzbtn .s{font-size:var(--s);color:var(--grey)}
.fshelf{margin:0 0 8px;position:relative}
.fhead{display:flex;align-items:center;font-size:12px;font-weight:500;padding:3px 6px;border-bottom:1px solid var(--rule);cursor:pointer}
.fhead:hover{color:var(--ink);background:var(--wash-ink);border-radius:6px 6px 0 0}
.fhead .n{margin-left:auto;font-weight:400;color:var(--grey);font-size:var(--s)}
.fdrawer{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--leaf);border:1px solid var(--rule);border-top:0;border-radius:0 0 8px 8px;box-shadow:0 8px 16px rgb(0 0 0/8%);padding:0 6px 6px}
.fdrawer .fclip{max-height:104px;overflow:hidden;position:relative}
.fdrawer .fclip::after{content:'';position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(rgb(244 242 237/0),var(--leaf))}
.fdrawer .more{display:block;padding:2px 4px 0;font-size:var(--s);color:var(--grey)}
.fshelf.collapsed:hover .fdrawer,.fshelf.peek .fdrawer{display:block}
ul.ftree{list-style:none;margin:0;padding:4px 6px 0 4px}
ul.ftree ul{list-style:none;margin:0 0 0 .55rem;padding:0 0 0 .5rem;border-left:1px solid var(--rule)}
ul.ftree li{margin:2px 0;font-size:12px;line-height:1.4}
ul.ftree .fold{all:unset;cursor:pointer;color:#5f5e5a;font:inherit}
ul.ftree .fold:hover{color:var(--ink)}
ul.ftree a{cursor:pointer}
ul.ftree a.doc{color:var(--link)}
ul.ftree a.other{color:#5f5e5a}
ul.ftree a.here{color:var(--ink);font-weight:600}
ul.ftree .pdfrow{margin:2px 0 2px 12px;font-size:12px}
ul.ftree .pdfrow a{color:#5f5e5a}
ul.ftree .aside{margin-left:.4em;color:var(--grey);font-size:.9em}
ul.ftree .aside.wrong{color:#5f5e5a}
.subtree{margin:0 0 6px 34px;border-left:1px solid #c9c6bd;padding-left:0}
.subtree .sr{border-top:0;border-bottom:1px solid var(--rule-soft)}
.subtree .sr-b{border-top:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;margin:0 0 14px}
.stepn{width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:var(--s);color:var(--grey)}
.steph{font-weight:500;margin:1px 0 6px}
.restsh{font-size:var(--s);color:var(--grey);margin:18px 0 4px 34px}
.docover{position:absolute;inset:14px 22px 14px 22px;z-index:60;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgb(0 0 0/18%);display:flex;flex-direction:column}
.docover .doc{flex:1;overflow:auto;border-radius:0 0 14px 14px}
.addpanel{padding:12px 14px!important;width:330px}
.addpanel .row2{display:flex;gap:8px;margin-top:10px}
.osec{display:flex;align-items:baseline;gap:6px;height:26px;padding:0 6px;border-radius:6px;cursor:pointer;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden}
.osec:hover{background:var(--wash-ink)}
.osec .pg{margin-left:auto;font-weight:400;font-size:var(--s);color:var(--grey)}
.olist{list-style:none;margin:0 0 0 10px;padding:0}
.olist li{display:flex;align-items:center;gap:4px;height:26px;padding:0 6px;border-radius:6px;cursor:pointer}
.olist li:hover{background:var(--wash-ink)}
.olist li.sel{background:var(--sel)}
.olist li .nm{width:30px;flex:none;font-variant-numeric:tabular-nums;color:var(--grey);margin-left:2px}
.olist li .rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.olist li.avail .rt,.olist li.avail .nm{color:var(--grey)}
.olist li input{margin:0;accent-color:var(--ink)}
.olist li .mk{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.wthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 18px;padding:16px 0}
table.works tbody tr.multi td{background:#dbe8f6}
.rtabs .tab{min-width:0;padding:0 10px}
.rg .act{margin-left:auto}
.rg-rule{border-top:2px solid var(--rule);margin:18px 0 0}
.navl .rule{border-top:1px solid var(--rule);margin:8px 6px}
.hit{background:rgb(255 235 60/60%)}
.searchbar{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.searchbar input{border:1px solid var(--rule);border-radius:7px;padding:3px 8px;width:150px;background:var(--sheet)}
.citebox{border-left:3px solid var(--rule);padding:4px 0 4px 12px}
.sr .acts2{margin-left:auto;display:flex;gap:14px;font-size:var(--s)}
.lmark{position:absolute;left:-48px;top:-2px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer;border-radius:6px;padding:0}
.lmark:hover{background:var(--wash-ink)}
.docin .env{position:relative}
.docin .env.fzt{background:rgb(24 95 165/6%);box-shadow:0 0 0 6px rgb(24 95 165/6%);border-radius:2px}
.fzpanel{position:absolute;z-index:45;width:540px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--float-shadow);padding:12px 14px 14px;font-family:var(--sans);font-size:var(--m);line-height:1.45;color:var(--ink)}
.fzpanel .fh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fzpanel .fh b{font-weight:500}
.fzline{display:flex;align-items:center;gap:6px;min-height:30px;border-top:1px solid var(--rule-soft);cursor:pointer}
.fzline .grey{margin-left:auto}
.fzlist{padding:0 0 6px 28px}
.fzitem{display:flex;align-items:center;gap:6px;min-height:28px}
.fzitem .seg{margin-left:auto}
.wl .pick{visibility:hidden;margin:0 0 0 8px;accent-color:var(--ink)}
.wl:hover .pick,.wl .pick:checked{visibility:visible}
.pickbar{display:flex;align-items:center;gap:12px;padding:6px 16px;border-top:1px solid var(--rule);background:var(--paper);position:relative;flex:none}
.wlist{position:relative}
svg.hood .box.inb{fill:#f3f7fb;stroke:#8fa9c7}
svg.hood text.tag{font-size:11px;fill:var(--link)}
.leansrc{font:12.5px/1.7 var(--mono);padding:18px 0 40px;color:#20201e;background:var(--sheet);flex:1;overflow:auto}
.leansrc .ln2{display:grid;grid-template-columns:52px 1fr 260px;white-space:pre}
.leansrc .no{color:var(--grey);text-align:right;padding-right:16px}
.leansrc .mk{background:#f3f7fb}
.leansrc .note2{font-family:var(--sans);font-size:var(--s);color:var(--link);padding-left:14px}
.views.vstrip{display:block;border:0;margin:8px 0 0;width:100%}
.views.vstrip a{box-shadow:none;margin:0}
.colstrip a{display:block;font-size:var(--s);color:var(--grey);padding:6px 0;text-align:center;border-left:2px solid transparent;width:100%}
.colstrip a.on{color:var(--ink);border-left-color:var(--accent);font-weight:500}
.colstrip a:hover{text-decoration:none;color:var(--ink)}
.rtabs .tab .n{color:var(--grey);margin-left:2px}
.views{display:flex;gap:16px;border-bottom:1px solid var(--rule);margin:0 0 12px}
.views a{padding:4px 0 6px;color:var(--grey);margin-bottom:-1px}
.views a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.views a:hover{text-decoration:none;color:var(--ink)}
.col-body{flex:1;min-height:0;overflow:auto;margin:0 -8px;padding:0 8px 10px;scrollbar-width:none}
.col-foot{margin:0 -14px;flex:none;font-size:var(--s);color:var(--grey)}
.col-foot .ln{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 12px;min-height:36px;border-top:1px solid var(--rule)}
.col-foot .ln .r{margin-left:auto}
.col-foot .keylink{border-top:0;min-height:0;padding:4px 14px 6px}
.legend-pop{position:absolute;left:12px;bottom:86px;width:250px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--float-shadow);padding:10px 12px;z-index:70;font-size:var(--s);color:var(--grey)}
.legend-pop .lg{display:grid;grid-template-columns:16px 1fr;gap:4px 8px;align-items:center;margin:4px 0 8px;color:var(--ink);font-size:var(--m)}
.rl{font-size:var(--s);color:var(--grey);margin:14px 2px 5px}
.navl{display:flex;flex-direction:column;gap:1px}
.navl a{display:flex;align-items:baseline;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink)}
.navl a .n{margin-left:auto;color:var(--grey);font-weight:400;font-variant-numeric:tabular-nums}
.navl a:hover{text-decoration:none;background:var(--wash-ink)}
.navl a.on{background:var(--wash-ink);font-weight:500}
.shelf{border-radius:8px;background:var(--wash-ink);padding:2px 0 6px;margin:0 0 8px}
.shelf-h{display:flex;align-items:center;gap:2px;padding:0 8px 0 6px;font-weight:500}
.caret{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;color:var(--grey);cursor:pointer;flex:none;margin-left:-6px}
.tree{list-style:none;margin:0;padding:0 6px 0 8px;line-height:28px}
.tree li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;min-height:28px;cursor:pointer}
.tree li.leaf{padding-left:22px}
.tree .in1{margin-left:16px}
.tree .in2{margin-left:32px}
.tree .cur{font-weight:600}
.tree .pb{color:var(--problem);font-weight:700;margin-left:6px}
.colbtn{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:8px;background:var(--wash-ink);padding:6px 10px;margin:0 0 6px;font-weight:500;cursor:pointer;text-align:left}
.colbtn:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.colbtn.on{background:var(--sheet);box-shadow:0 0 0 1px var(--rule)}
.colbtn .ico{width:16px;color:var(--grey);text-align:center}
.outline{list-style:none;margin:0;padding:0;line-height:1.8;color:var(--grey)}
.outline li{padding-left:8px}.outline li.on{border-left:2px solid var(--link);color:var(--ink);font-weight:500;padding-left:6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.row{display:flex;min-height:0;flex:1}
.pane{display:flex;flex-direction:column;min-width:0;height:100%;position:relative}
.pane+.pane{border-left:4px solid #e4e2dc}
.tabs{height:32px;flex:none;display:flex;background:#efede8;border-bottom:1px solid var(--rule)}
.tab{display:flex;align-items:center;gap:10px;padding:0 12px;min-width:110px;color:var(--grey);border-right:1px solid var(--rule);white-space:nowrap;cursor:pointer;margin-bottom:-1px}
.tab.on{background:var(--paper);color:var(--ink)}
.tab .x{margin-left:auto;margin-right:-8px}
.tab.pin{min-width:0;font-weight:500}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--rule);background:var(--paper);color:var(--grey);white-space:nowrap;position:relative}
.tb .sep{width:1px;height:18px;background:var(--rule);margin:0 4px}
.tb .it{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent;background:none;color:var(--grey)}
.tb .it:hover{background:var(--sel)}
.tb .it.on{color:var(--ink);background:var(--wash-ink)}
.tb .grow{flex:1}
.tb .zbox{border:1px solid var(--rule);border-radius:5px;padding:1px 8px;background:var(--sheet);color:var(--ink)}
.tb .pbm{color:var(--problem)}
.tools2{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--rule);background:#f4f2ed;color:var(--grey)}
.tools2 .tg{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);padding:0 8px}
.cv{margin-left:1px;vertical-align:middle}

.btn{font-size:var(--m);line-height:1.3;padding:4px 11px;border-radius:7px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--sel)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.primary:hover{background:#4a4a46}
.btn.quiet{background:transparent;border-color:transparent;color:var(--grey)}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;z-index:50;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--float-shadow);padding:6px 0;min-width:220px;text-align:left;white-space:normal}
.menu .mh{padding:5px 14px 7px;font-size:var(--s);color:var(--grey)}

.menu hr{border:0;border-top:1px solid var(--rule);margin:5px 0}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--sheet);vertical-align:middle}
.seg button{border:0;background:none;padding:1px 9px;font-size:var(--s);color:var(--grey);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--leaf);color:var(--ink);font-weight:500}
.grey{color:var(--grey)}
.small{font-size:var(--s)}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.who{color:var(--agent)}
.gl{display:inline-block;vertical-align:-1.5px;flex:none}
.slot{display:inline-block;width:14px;text-align:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:var(--s);color:var(--grey)}
.chip+.chip{margin-left:12px}
.up{font-style:normal}
.mathtext{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink)}
#toast{display:none!important;position:fixed;left:270px;bottom:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--float-shadow);padding:7px 10px 7px 14px;display:none;align-items:center;gap:12px;z-index:200}

/* ===== library: works ===== */
.works-wrap{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.works-bar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--rule-soft)}
.search{border:1px solid var(--rule);border-radius:7px;padding:4px 10px;width:300px;background:var(--sheet)}
.search::placeholder{color:var(--grey)}
.works-scroll{flex:1;overflow:auto;padding:0 20px 20px}
table.works{width:100%;border-collapse:collapse;table-layout:fixed}
table.works th{position:sticky;top:0;background:var(--paper);font-size:var(--s);color:var(--grey);font-weight:400;text-align:left;padding:7px 10px 6px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;z-index:2}
table.works th:hover{color:var(--ink)}
table.works th.sorted{color:var(--ink)}
table.works td{height:28px;line-height:18px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
table.works tbody tr:nth-child(even) td{background:var(--stripe)}
table.works tbody tr:hover td{background:#eeebe4}
table.works tbody tr.sel td{background:var(--sel)}
table.works td.t{font-family:var(--serif);font-size:14px}
table.works td.d{color:var(--grey);font-size:var(--s)}
table.works td.act{text-align:right;padding:0 2px 0 0;overflow:visible;line-height:0;vertical-align:middle}
table.works td.act .menuwrap{vertical-align:top}
table.works td.act .ctl{visibility:hidden}
table.works tr:hover td.act .ctl,table.works tr.hot td.act .ctl{visibility:visible}
table.works .found{font-family:var(--sans);font-size:var(--s);color:var(--grey);margin-left:8px}
.ctl{border:0;background:none;color:var(--grey);cursor:pointer;padding:0 8px;min-width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:2px}
.ctl:hover{background:var(--wash-ink);color:var(--ink)}
.drop-over{position:absolute;inset:8px;z-index:80;border:2px dashed #8fa9c7;border-radius:14px;background:rgb(251 250 248/88%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drop-over b{font-size:var(--l);font-weight:500}
.empty{flex:1;display:flex;align-items:center;justify-content:center}
.empty .box{width:560px;border:2px dashed var(--rule);border-radius:16px;padding:46px 40px;text-align:center;background:var(--sheet)}
.empty .box b{display:block;font-size:var(--l);font-weight:500;margin-bottom:8px}
.empty .box p{color:var(--grey);margin:0 0 18px}
.empty .paste{display:flex;gap:8px;justify-content:center;margin-top:14px}

/* ===== reader ===== */
.pdfbody{flex:1;min-height:0;display:flex;position:relative}
.pdfwrap{flex:1;min-width:0;overflow:auto;background:#ebe9e3;position:relative;padding:14px 0 40px}
.pdfpage{width:600px;margin:0 auto 14px;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/14%),0 0 0 1px rgb(0 0 0/3%);padding:46px 70px 50px 78px;font-family:var(--tex);font-size:12.4px;line-height:1.45;color:#141414;position:relative}

.pdfpage .rh .pn{position:absolute;right:0}
.pdfpage p{margin:0 0 7px;text-align:justify;hyphens:auto}
.pdfpage p.ind{text-indent:1.4em}
.pdfpage h3{font-size:13.2px;font-weight:700;margin:16px 0 8px;text-align:center;font-variant:small-caps}
.pdfpage .disp{display:flex;justify-content:center;position:relative;margin:6px 0 8px}
.pdfpage .disp .eqn{position:absolute;right:0}
.pdfpage .item{padding-left:2em;text-indent:-1.6em;margin:0 0 4px;text-align:left}
.pdfpage .qed{float:right;font-size:9px;margin-top:3px}
.pdfpage .tt{font-size:18px;text-align:center;margin:30px 0 12px}
.pdfpage .au{text-align:center;margin-bottom:6px}
.pdfpage .abs{font-size:11px;margin:12px 30px}
.pdfpage .sech{font-size:14px;font-weight:700;margin:14px 0 6px}

.stmt{font-style:italic}
.ann-hl{background:rgb(255 235 60/55%)}
.res{position:relative;margin:0 0 7px;padding:1px 0;border-radius:2px}
.res.sel{background:rgb(24 95 165/7%);box-shadow:0 0 0 4px rgb(24 95 165/7%)}
.res.marked{outline:1.5px solid var(--link);outline-offset:4px;border-radius:1px}
.dmark{position:absolute;left:-66px;top:0;bottom:0;width:60px}
.dbr{position:absolute;right:0;top:1px;bottom:1px;border-left-width:3px}
.st-checked .dbr{border-left-style:solid;border-left-color:var(--green)}
.st-unchecked .dbr{border-left-style:dashed;border-left-color:var(--amber)}
.st-stub .dbr{border-left-style:dotted;border-left-color:var(--grey)}
.st-marked .dbr{border-left-style:solid;border-left-color:var(--link)}
.dchip{position:absolute;right:8px;top:-1px;display:inline-flex;gap:3px;align-items:center;font:500 10px/1 var(--sans);padding:2px 4px 2px 3px;border-radius:5px;border:1.3px solid var(--rule);background:#fff;cursor:pointer;color:var(--ink);white-space:nowrap}
.st-checked .dchip{border-color:var(--green)}
.st-unchecked .dchip{border-color:var(--amber);border-style:dashed}
.st-stub .dchip{border-color:var(--grey);border-style:dotted}
.st-marked .dchip{border-color:var(--link)}
.dchip.on{box-shadow:0 0 0 2.5px rgb(24 95 165/35%)}
.selpop{position:absolute;z-index:30;background:var(--sheet);border:1px solid var(--rule);border-radius:9px;box-shadow:var(--float-shadow);padding:4px;display:flex;gap:2px}
.selpop button{border:0;background:none;padding:4px 9px;border-radius:6px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.selpop button:hover{background:var(--leaf)}
.selpop button.pri{background:var(--ink);color:#fff}
.sel-words{background:rgb(24 95 165/22%)}

/* a work in the column */
.wk-title{font-family:var(--serif);font-size:var(--l);line-height:1.25;margin-top:2px}
.wk-meta{font-size:var(--s);color:var(--grey);margin:4px 0 8px}
.entry{font:11px/1.5 var(--mono);white-space:pre;background:var(--wash-ink);border-radius:7px;padding:6px 8px;margin:0 0 8px;overflow:hidden;color:var(--grey)}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;align-items:center;gap:4px;height:26px;padding:0 6px;border-radius:6px;cursor:pointer}
.rlist li:hover{background:var(--wash-ink)}
.rlist li.sel{background:var(--sel)}
.rlist li .nm{width:30px;flex:none;font-variant-numeric:tabular-nums;color:var(--grey);margin-left:2px}
.rlist li .rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sub2{font-size:var(--s);color:var(--grey);padding:0 6px 4px 54px;margin-top:-4px}
.tickbar{position:sticky;bottom:0;background:var(--leaf);padding:8px 0 4px;display:flex;gap:8px;align-items:center}

/* the comparison (Library and Review) */
.side{width:370px;flex:none;border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:16px 18px 20px;position:relative}
.side .x{position:absolute;right:8px;top:8px}
.nh{font-family:var(--serif);font-size:var(--l);line-height:1.25;padding-right:20px}
.nh .tl{color:var(--grey)}
.nsrc{font-size:var(--s);color:var(--grey);margin:3px 0 10px}
.nsrc.agent{color:var(--agent)}
.nbody{border-left:3px solid var(--taxon-result);padding:2px 0 2px 12px;margin:10px 0 14px}
.nbody.def{border-left-color:var(--taxon-definition)}
.nbody .item{padding-left:1.6em;text-indent:-1.3em;margin:2px 0}
.plain{font:12px/1.6 var(--mono);white-space:pre-wrap;background:var(--leaf);border-radius:8px;padding:10px 12px;margin:10px 0 14px;word-break:break-word}
.plain .mac{border-bottom:1px dotted var(--grey);cursor:help}
.refchip{display:inline-flex;align-items:center;gap:3px;font:500 11px/1.4 var(--sans);background:var(--sheet);border:1px solid #b4b2a9;border-radius:4px;padding:0 4px;color:var(--link);cursor:help;white-space:nowrap}
.ask{margin:4px 0 8px}
.answers{display:flex;gap:8px;align-items:center}
.rel{display:grid;grid-template-columns:56px 1fr;gap:4px 8px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule-soft)}
.rel dt{color:var(--grey);font-size:var(--s)}
.rel dd{margin:0}

/* ===== review ===== */
.rv{flex:1;overflow:auto;padding:10px 24px 60px}
.rg{display:flex;align-items:center;gap:8px;height:30px;margin-top:10px;color:var(--grey);font-size:var(--s);cursor:pointer;border-bottom:1px solid var(--rule)}
.rg .n{color:var(--grey)}
.rg:hover{color:var(--ink)}
.rg.drop{border:2px dashed #8fa9c7;border-radius:10px;height:auto;padding:10px 12px;color:var(--ink);font-size:var(--m);background:#f4f8fc}
.rr{border-bottom:1px solid var(--rule-soft)}
.rr-h{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;cursor:pointer}
.rr-h:hover{background:#f3f1ec}
.rr-h .tx2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-h .meta{font-size:var(--s);color:var(--grey);white-space:nowrap}
.rr-h .hov{visibility:hidden}
.rr-h:hover .hov{visibility:visible}
.rr-h .chev{color:var(--grey);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.rr.open>.rr-h{background:#f3f1ec}
.rr-b{padding:8px 10px 14px 34px}
.sr{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px;cursor:pointer;border-top:1px solid var(--rule-soft)}
.sr:hover{background:#f6f4ef}
.sr.open{background:var(--sel)}
.sr .meta{margin-left:auto;font-size:var(--s);color:var(--grey)}
.sr-b{padding:10px 6px 14px 26px;border-top:1px solid var(--rule-soft)}
.del{color:var(--change);text-decoration:line-through;background:var(--change-wash)}
.ins{color:var(--change);text-decoration:underline;text-underline-offset:2px;background:var(--change-wash)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.crop{background:#ebe9e3;border-radius:8px;padding:10px}
.crop .pdfpage{width:auto;margin:0;padding:12px 20px;box-shadow:0 1px 2px rgb(0 0 0/12%);font-size:12.2px}
.crop .hl{background:rgb(250 238 218/85%);box-shadow:0 0 0 4px rgb(250 238 218/85%)}
.crop-cap{font-size:var(--s);color:var(--grey);margin:0 0 6px}

/* attest */
table.att{width:100%;border-collapse:separate;border-spacing:0;margin-top:6px}
table.att th{font-size:var(--s);color:var(--grey);font-weight:400;text-align:left;padding:4px 10px 6px;border-bottom:1px solid var(--rule)}
table.att th.ag{color:var(--agent)}
table.att td{padding:9px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.att td.k{width:60px;color:var(--grey)}
table.att td.pp{width:27%}
table.att td.ll{width:38%}
table.att td.ag{background:#fbf9f6}
table.att .lbl{font-size:var(--s);color:var(--grey);font-family:var(--sans)}
.lean{font:12px/1.55 var(--mono);background:#f3f2ee;border-radius:7px;padding:7px 10px;white-space:pre;color:#20201e;overflow:hidden}
.lean .kw{color:#7a3e9d}.lean .nm{color:#185fa5}
.fold{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--rule-soft);cursor:pointer;color:var(--grey)}
.fold-b{padding:2px 0 8px 22px}
.diverge{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:14px 0 0;padding:10px 12px;border:1px solid var(--rule);border-left:3px solid var(--agent);border-radius:8px;background:var(--sheet)}
.diverge .w{font-size:var(--s);color:var(--agent);white-space:nowrap;padding-top:2px}
.att-bar{display:flex;align-items:center;gap:12px;margin-top:14px}
.att-bar .s{font-size:var(--s);color:var(--grey)}

/* ===== web ===== */
.webp{flex:1;min-height:0;display:flex}
.wlist{width:520px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.wlist-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule-soft)}
.wlist-scroll{flex:1;overflow:auto}
.wl{display:flex;align-items:center;gap:4px;height:28px;padding:0 16px;cursor:pointer}
.wl:nth-child(even){background:var(--stripe)}
.wl:hover{background:#eeebe4}
.wl.sel{background:var(--sel)}
.wl .nm2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.wl .src{color:var(--grey);font-size:var(--s);white-space:nowrap}
.wl-group{font-size:var(--s);color:var(--grey);padding:10px 16px 4px}
.wfocus{flex:1;min-width:0;overflow:auto;padding:14px 22px 40px}
.trail{font-size:var(--s);color:var(--grey);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.trail .cur{color:var(--ink)}
.focus{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);padding:14px 16px}
.focus .fh{font-family:var(--serif);font-size:var(--l);line-height:1.25}
.focus .fsrc{font-size:var(--s);color:var(--grey);margin:3px 0 8px}
.focus .fbody{border-left:3px solid var(--taxon-result);padding-left:11px;margin:8px 0 10px}
.focus .vr{color:var(--ink)}
.focus .more{font-size:var(--s);color:var(--grey);margin-top:10px;border-top:1px solid var(--rule-soft);padding-top:8px;cursor:pointer;display:flex;gap:10px}
.focus .moreb dl{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;margin:8px 0 0}
.focus .moreb dt{color:var(--grey);font-size:var(--s)}
.focus .moreb dd{margin:0}
.nb3{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.nbh{font-size:var(--s);color:var(--grey);margin:0 0 4px}
.nbr{display:flex;align-items:center;gap:4px;height:26px;cursor:pointer;border-bottom:1px solid var(--rule-soft)}
.nbr:hover{background:#f3f1ec}
.nbr .nm2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.nbr .src{color:var(--grey);font-size:var(--s)}
.outscope{font-size:var(--s);color:var(--grey);padding:4px 0}
.scope label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.scope label:hover{background:var(--wash-ink)}
.scope label.on{background:var(--wash-ink);font-weight:500}
.scope input{margin:0;accent-color:var(--ink)}
.scope select{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);padding:1px 4px}
.drawn{flex:1;min-width:0;overflow:auto;padding:14px 20px 30px}
.drawn-side{flex:none;border-left:1px solid var(--rule);overflow:auto;padding:14px 18px 30px;background:var(--paper)}
svg.hood{display:block}
svg.hood .box{fill:#fff;stroke:#b4b2a9;stroke-width:1}
svg.hood .box.focus{stroke:var(--ink);stroke-width:1.5}
svg.hood .box.more{fill:var(--stripe);stroke-dasharray:3 3}
svg.hood .edge{fill:none;stroke:#a9a69c;stroke-width:1.3}
svg.hood .edge.proof{stroke-dasharray:5 4}
svg.hood text{font-family:var(--sans);font-size:13px;fill:var(--ink)}
svg.hood text.src{font-size:11px;fill:var(--grey)}
svg.hood g.n{cursor:pointer}
svg.hood g.n:hover .box{stroke:var(--link)}
.hood-legend{display:flex;gap:16px;font-size:var(--s);color:var(--grey);align-items:center;margin:8px 0 0}

/* ===== docs ===== */
.doc{flex:1;overflow:auto;background:var(--paper);position:relative}
.docin{max-width:560px;margin:0 auto;padding:26px 24px 60px;font-family:var(--serif);font-size:15.5px;line-height:1.55;color:#222}
.docin p{margin:0 0 4px;text-align:justify;hyphens:auto}
.docin p+p{text-indent:1.4em}
.docin h3{font-weight:400;font-variant:small-caps;text-align:center;font-size:16px;margin:20px 0 12px}
.docin .env{margin:14px 0}
.cite{color:var(--link);cursor:pointer}
.cite.stub{text-decoration:underline dotted var(--grey);text-underline-offset:3px}

.qq{color:var(--problem);font-weight:700}
.hcard{position:absolute;z-index:40;width:570px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--float-shadow)}
.hc-head{display:flex;align-items:center;gap:8px;padding:11px 14px 4px;flex-wrap:wrap}

.pk-h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule-soft)}
.pk-b{flex:1;overflow:auto;padding:0 14px 14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 16px;padding-top:14px}
.th{cursor:pointer}
.th .pg{height:160px;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:16px 12px;font-family:var(--tex);display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden;position:relative}

.th .cap .t{font-family:var(--serif);font-size:var(--m);color:var(--ink);display:block}
.notes-page{width:760px;max-width:calc(100% - 40px);margin:0 auto;padding:18px 26px 60px}
.ng{margin:0 0 16px}
.ng h2{font-size:var(--s);font-weight:400;color:var(--grey);margin:0 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.note{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;padding:7px 4px;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.note:hover{background:#f7f5f1}
.note .sw{width:3px;height:16px;border-radius:2px;margin:2px 0 0 4px}

function sm(num){ const r = SMLIST.find(x=>x.num===num); return stateOf('smith', r); }
function smithP12(){
  const ov = st.lib.overlay, sel = st.lib.sel.smith;
  return `<div class="pdfpage"><div class="rh"><span>Widgets and their bounds</span><span class="pn">12</span></div>
   <p>compactness is needed for (ii) only through the finiteness of the cover; the boundary condition is what makes a widget closed under the operations of Section 2, and without compactness it does not make a set bounded, <span class="ann-hl">as the half-plane of Example 2.2 shows</span>.</p>
   <p class="ind">The two conditions are independent. A closed ball is compact and has its boundary in 𝒲 only when the sphere is admissible; we return to this in Section 5.</p>
   <h3 data-sec="3">3. Bounds</h3>
   <p>Throughout this section ${M.W} ⊂ ${M.Rn} is a widget. We bound it in two steps, its diameter first and then its distance from the origin; neither step uses the boundary condition.</p>
   ${res('d3.1',sm('3.1'),'3.1',`<p><b>Definition 3.1</b> (Radius). The <em>radius</em> of a bounded set <i>S</i> ⊂ ${M.Rn} is rad <i>S</i> = inf{<i>r</i> ≥ 0 : <i>S</i> ⊂ <i>B</i>(0, <i>r</i>)}.</p>`,{overlay:ov, sel:sel==='d3.1'})}
   ${res('l3.2',sm('3.2'),'3.2',`<p><b>Lemma 3.2</b> (Test lemma). <span class="stmt">Let ${M.W} be a widget (Definition 2.1). Then</span></p><p class="item">(i)&ensp;<span class="stmt">${M.diam} ${M.W} &lt; ∞; and</span></p><p class="item">(ii)&ensp;<span class="stmt">for every ${M.x0} ∈ ${M.W}, each point ${M.x} of ${M.W} satisfies</span></p><div class="disp"><span>|${M.x}| ≤ ${M.diam} ${M.W} + |${M.x0}|.</span><span class="eqn">(3.3)</span></div>`,{overlay:ov, sel:sel==='l3.2'})}
   <p><i>Proof.</i> A widget is compact (Definition 2.1), so finitely many unit balls cover it, which bounds its diameter.</p></div>`;
}
function smithP13(){
  const ov = st.lib.overlay, sel = st.lib.sel.smith;
  return `<div class="pdfpage"><div class="rh"><span>Jane Smith</span><span class="pn">13</span></div>
   <p>The second claim is the triangle inequality.<span class="qed">□</span></p>
   ${res('p3.4',sm('3.4'),'3.4',`<p><b>Proposition 3.4</b> (Test proposition). <span class="stmt">Let ${M.W} be a widget as in Definition 2.1. Then ${M.W} lies in a ball about the origin.</span></p>`,{overlay:ov, sel:sel==='p3.4'})}
   <p><i>Proof.</i> By Lemma 3.2, the bound (3.3) holds for a fixed ${M.x0}. The covering estimate of [4, Lemma 2.1] then gives the radius. For sets that are not compact see [4].<span class="qed">□</span></p>
   <p><b>Remark 3.5.</b> The radius found in Proposition 3.4 depends on ${M.x0} only through |${M.x0}|, so it is least when ${M.x0} is a point of ${M.W} nearest the origin.</p>
   <h3 data-sec="4">4. Covering</h3><p>We now drop the assumption that the cover be by unit balls. The estimate of [4] counts balls of a fixed radius; the next theorem lets the radius vary along the boundary.</p></div>`;
}

  h = h.replace(/\\(diam|rad|Wid)\b/g, (m,n)=>`<span class="mac" title="Smith 2024 defines it">\\${n}</span>`);
  return h;
}

/* ================= Okafor ================= */
function okaforP6(){
  return `<div class="pdfpage"><div class="rh"><span>Median orders on weighting lattices</span><span class="pn">6</span></div>
   <p>so a median order is determined by its restriction to the arrows at any one vertex, and two median orders that agree there agree everywhere.</p>
   <p><b>Theorem 2.3.</b> <span class="stmt">Let <i>L</i> be the lattice of balanced weightings of a finite quiver <i>Q</i>, and let ⪯ be a median order on <i>L</i>. For <i>h</i> ≥ 1, the number of <i>w</i> ∈ <i>L</i> with ‖<i>w</i>‖<sub>∞</sub> ≤ <i>h</i> is a polynomial in <i>h</i> of degree rank <i>L</i>.</span></p>
   <p><i>Proof.</i> Write <i>N</i>(<i>h</i>) for the number in question. The median order splits the box of side 2<i>h</i> into intervals [<i>u</i>, <i>v</i>] with <i>u</i> ⪯ <i>v</i>, each of which is counted by Lemma 2.4 below, and the number of intervals is itself polynomial in <i>h</i> by the argument of Section 1.<span class="qed">□</span></p>
   ${res(null,'marked','',`<p><b>Lemma 2.4.</b> <span class="stmt">Let ⪯ be a median order on <i>L</i> and let <i>u</i> ⪯ <i>v</i>. Then the interval [<i>u</i>, <i>v</i>] is a sublattice of <i>L</i>, and it is a box in the coordinates of Lemma 2.2.</span></p>`,{cls:'marked'})}
   <p><i>Proof.</i> Meets and joins of elements between <i>u</i> and <i>v</i> stay between them because ⪯ is a lattice order. In the coordinates of Lemma 2.2 the order is the product order.<span class="qed">□</span></p></div>`;
}
function okaforP7(){
  const marked = st.lib.marked7;
  const inner = `<p><span class="${marked?'':'sel-words'}"><b>Remark 2.5.</b> The box of Lemma 2.4 need not be a cube: its sides are the coordinate differences of <i>v</i> − <i>u</i>, which may vary.</span></p>
   <p><span class="${marked?'':'sel-words'}"><b>Proposition 2.6.</b> <span class="stmt">Every finite weighting lattice admits a median order, unique once a base vertex is chosen.</span></span></p>`;
  return `<div class="pdfpage" style="position:relative"><div class="rh"><span>Chidi Okafor</span><span class="pn">7</span></div>
   <p>The constant in Theorem 2.3 is not explicit; Section 4 computes it for quivers with one cycle, where the median order is the order by height.</p>
   ${marked ? res(null,'marked','',inner,{cls:'marked'}) : `<div style="margin:0 0 7px">${inner}</div>
   <div class="selpop" style="left:220px;top:206px"><button class="pri" data-act="mark7">${g('marked',11).replace(/var\(--link\)/g,'#fff')} mark to digest</button><button data-act="toast" data-t="Highlighted">highlight</button><button data-act="toast" data-t="A note on these words opens beside them">note</button><button data-act="toast" data-t="Added to agent tasks: a question on these words">ask an agent…</button></div>`}
   <p style="margin-top:${marked?10:40}px"><i>Proof.</i> Choose a base vertex and order the arrows at it by their weight; extend along a spanning tree. Two choices of base vertex give orders that differ by a translation.<span class="qed">□</span></p></div>`;
}

  const showO = st.docs.showOrph !== false;
  const list = NOTELIST.filter(n=>showO || !n.orph);
  const orphCount = NOTELIST.filter(n=>n.orph && !gone.has(n.id)).length;
  const bar = `<div class="notes-bar">sort by <span class="seg"><button class="${st.docs.nsort!=='date'?'on':''}" data-act="nsort" data-v="work">work</button><button class="${st.docs.nsort==='date'?'on':''}" data-act="nsort" data-v="date">date</button></span><span style="flex:1"></span><label><input type="checkbox" data-act="orphtoggle" ${showO?'checked':''}> show orphaned notes (${orphCount})</label></div>`;
  let body;
  if(st.docs.nsort==='date'){
    body = `<div class="ng">${[...list].sort((a,b)=>b.ord-a.ord).map(n=>one(n,true)).join('')}<div class="small grey" style="padding:8px 4px">11 more, older</div></div>`;
  } else {
    const groups = [['Orphaned · their document is gone, or their words are not found', list.filter(n=>n.orph), ''], ['main.tex', list.filter(n=>!n.orph && n.where==='main.tex'), '6 more'], ['Arden 2024', list.filter(n=>!n.orph && n.where==='Arden 2024'), '1 more'], ['Smith 2024', list.filter(n=>!n.orph && n.where==='Smith 2024'), ''], ['bounds.tex', [], '3 notes']];
    body = groups.map(([h,ns,more])=>{ const vis = ns.filter(n=>!gone.has(n.id)); if(!vis.length && !more) return ''; return `<div class="ng"><h2>${h}&ensp;${vis.length||''}</h2>${vis.map(n=>one(n,false)).join('')}${more?`<div class="small grey" style="padding:6px 4px">${more}</div>`:''}</div>`; }).join('');
  }
  return `<div class="doc"><div class="notes-page">${bar}${body}</div></div>`;
}

function docText(){
  const card = st.docs.card;
  return `<div class="docin">
      <h3>1. Introduction</h3>
      <p>A quiver carries two lattices: the weightings of its arrows, and the balanced weightings, those that neither create nor destroy anything at a vertex. This paper is about the second. Our main result, Theorem <span class="cite">3.1</span>, computes its rank from the combinatorics of the underlying graph alone, and Theorem <span class="cite">3.4</span> counts the balanced weightings of bounded height.</p>
      <p>The cycle lattice of a quiver is classical, and we follow <span class="cite ${card==='node'?'hot':''}" data-c="node">[1, Proposition 2.1]</span> throughout; the counting argument of Section 3 is an adaptation of the median-order technique of <span class="cite stub ${card==='stub'?'hot':''}" data-c="stub">[2, Theorem 2.3]</span>. We also use the exchange bound of Lemma <span class="qq" title="a reference points nowhere">??</span>. The extension criterion <span class="cite">[3, Theorem 5.1]</span> appears only in the second arXiv version of that paper. The survey <span class="cite">[4]</span> lists what is known for infinite quivers, none of which we use.</p>
      ${denv('m:c1.1','<b>Convention 1.1.</b>&ensp;Every quiver in this paper is finite: both <i>V</i>(<i>Q</i>) and <i>A</i>(<i>Q</i>) are finite sets, and loops and parallel arrows are allowed.','unformal')}
      <h3>2. Weightings and the divergence map</h3>
      ${denv('m:d2.1','<b>Definition 2.1.</b> (Quiver)&ensp;A <em>quiver</em> <i>Q</i> is a quadruple (<i>V</i>, <i>A</i>, <i>s</i>, <i>t</i>) with <i>V</i> and <i>A</i> finite sets and <i>s</i>, <i>t</i>: <i>A</i> → <i>V</i> the source and target maps.')}
      ${denv('m:d2.2','<b>Definition 2.2.</b> (Divergence)&ensp;The <em>divergence</em> of a weighting <i>w</i> at a vertex <i>v</i> is the weight arriving at <i>v</i> less the weight leaving it.')}
      ${denv('m:d2.4','<b>Definition 2.4.</b> (Box)&ensp;A <em>box</em> is a product of intervals of weightings, one for each arrow.')}
      ${denv('m:p2.6','<b>Proposition 2.6.</b>&ensp;<i>The cycle lattice 𝒵(Q) is saturated in W(Q).</i>')}
      <h3>3. The rank of the cycle lattice</h3>
      ${denv('m:t3.1','<b>Theorem 3.1.</b> (Rank)&ensp;<i>Let Q be a quiver whose underlying graph has c connected components. Then</i> rank 𝒵(<i>Q</i>) = |<i>A</i>(<i>Q</i>)| − |<i>V</i>(<i>Q</i>)| + <i>c</i>.')}
      ${denv('m:d3.2','<b>Definition 3.2.</b> (Height)&ensp;The <em>height</em> of a weighting <i>w</i> is the largest of the |<i>w</i>(<i>a</i>)|.')}
      ${denv('m:l3.3','<b>Lemma 3.3.</b>&ensp;<i>Let w be a balanced weighting of a quiver Q. If</i> supp <i>w is a forest, then w</i> = 0<i>; if the underlying graph of Q is a cycle, w is constant up to sign.</i>')}
      ${denv('m:t3.4','<b>Theorem 3.4.</b> (Bounded balanced weightings)&ensp;<i>The number of balanced weightings of Q of height at most h is a polynomial in h of degree</i> |<i>A</i>(<i>Q</i>)| − |<i>V</i>(<i>Q</i>)| + <i>c</i>.')}
      ${denv('m:c3.5','<b>Corollary 3.5.</b>&ensp;<i>A connected quiver has a nonzero balanced weighting if and only if its underlying graph has a cycle</i><span class="ins"><i> of length at least 2</i></span>.')}
      ${denv('m:d3.7','<b>Definition 3.7.</b> (Connected)&ensp;A quiver is <em>connected</em> if its underlying graph is connected<span class="ins"> after its loops are removed</span>.')}
      ${denv('m:p3.8','<b>Proposition 3.8.</b>&ensp;<i>A connected quiver whose underlying graph is a tree has no nonzero balanced weighting.</i>')}
      ${denv('m:l3.9','<b>Lemma 3.9.</b>&ensp;<i>Removing a bridge from a connected quiver leaves two connected quivers.</i>')}
      ${denv('m:l3.5','<b>Lemma 3.10.</b>&ensp;<i>Each interval of balanced weightings is a box.</i>')}
      ${denv('m:l3.6','<b>Lemma 3.11.</b>&ensp;<i>The boxes of height at most h number polynomially many in h.</i>')}
    </div>`;
}

function ardenP1(){
  return `<div class="pdfpage" style="width:520px;padding:30px 46px 40px 52px;font-size:11.6px">
    <div class="tt">Cycle spaces of finite quivers</div><div class="au">Elspeth Arden</div>
    <div class="abs"><b>Abstract.</b> We collect the standard facts about the cycle space of a finite quiver: that the divergence map has the expected image, that its kernel is saturated, and that the rank of the kernel depends only on the underlying graph.</div>
    <div class="sech" data-sec="1">1&ensp;Introduction</div>
    <p>Let <i>Q</i> be a finite quiver. A weighting of <i>Q</i> assigns an integer to each arrow, and the weightings form a free abelian group of rank |<i>A</i>(<i>Q</i>)|. Among them sit the weightings that balance at every vertex.</p>
    <p><b>Definition 1.1.</b> A <em>quiver</em> is a quadruple <i>Q</i> = (<i>V</i>, <i>A</i>, <i>s</i>, <i>t</i>) in which <i>V</i> and <i>A</i> are finite sets and <i>s</i>, <i>t</i>: <i>A</i> → <i>V</i> are functions, called the source and target maps.</p>
    <p><b>Definition 1.2.</b> The <em>cycle space</em> of a quiver <i>Q</i> is the kernel 𝒵(<i>Q</i>) of the divergence map ∂: ℤ<sup><i>A</i>(<i>Q</i>)</sup> → ℤ<sup><i>V</i>(<i>Q</i>)</sup> whose value at a vertex <i>v</i> is the total weight of the arrows with target <i>v</i> less that of the arrows with source <i>v</i>.</p>
    <div class="sech" data-sec="2">2&ensp;The image of the divergence map</div>
    <p>The divergence of any weighting sums to zero over the vertices of each connected component, because each arrow contributes +1 at its target and −1 at its source.</p>
    <p><b>Proposition 2.1.</b> <span class="stmt">Let <i>Q</i> be a quiver whose underlying graph has <i>c</i> connected components. The image of the divergence map is the lattice of integer vectors in ℤ<sup><i>V</i>(<i>Q</i>)</sup> <span class="ann-hl">whose coordinates sum to zero on each component</span>, and its rank is |<i>V</i>(<i>Q</i>)| − <i>c</i>.</span></p>
    <p><i>Proof.</i> Each arrow <i>a</i> has divergence <i>e</i><sub><i>t</i>(<i>a</i>)</sub> − <i>e</i><sub><i>s</i>(<i>a</i>)</sub>, which lies in the stated lattice; a spanning forest gives a basis.<span class="qed">□</span></p></div>`;
}

  openwork:(t,e)=>{ const w=t.dataset.w; const wk=byId(w); if(wk.lookingUp) return; if(e&&(e.metaKey||e.ctrlKey||e.shiftKey)&&st.lib.tab==='works'){ st.lib.multi.has(w)?st.lib.multi.delete(w):st.lib.multi.add(w); render(); return; } if(!st.lib.open.includes(w)) st.lib.open.push(w); st.lib.tab=w; st.menu=null; st.view='library'; render(); },
  libtab:(t,e)=>{ if(e.target.closest('[data-act="closetab"]')) return ACTS.closetab(e.target.closest('[data-act="closetab"]'),e); st.lib.tab=t.dataset.t; render(); },
  closetab:(t,e)=>{ e.stopPropagation(); const w=t.dataset.t; st.lib.open=st.lib.open.filter(x=>x!==w); if(st.lib.tab===w) st.lib.tab='works'; render(); },
  addwork:()=>toast('Choose PDFs, TeX sources or a .bib file', false),
  delwork:(t,e)=>{ e.stopPropagation(); st.menu=null; render(); toast(`Deleted ${WNAME(t.dataset.w)}, with its results and notes`); },
  entry:()=>{ st.entry=!st.entry; render(); },
  sel:(t,e)=>{ if(e.target.closest('input')) return; const w=t.dataset.w, id=t.dataset.id; st.lib.sel[w]=id; st.scrollNode=id; const r=(w==='smith'?SMLIST:ARLIST).find(x=>(x.id||'n'+x.num)===id); if(w==='smith'&&r) st.lastSel = {'d3.1':'s24:d3.1','l3.2':'s24:l3.2','p3.4':'s24:p3.4','d2.1':'s24:d2.1','t4.1':'s24:t4.1'}[id]||null; render(); },
  closeSide:t=>{ st.lib.sel[t.dataset.w]=null; render(); },
  plain:t=>{ st.lib.plain=t.dataset.v==='1'; render(); },
  tick:(t,e)=>{ e.stopPropagation(); const n=t.dataset.n; st.lib.ticks.has(n)?st.lib.ticks.delete(n):st.lib.ticks.add(n); render(); },
  untick:()=>{ st.lib.ticks.clear(); st.lib.choosing=false; render(); },
  digestTicked:()=>{ const n=st.lib.ticks.size; st.lib.ticks.forEach(k=>st.lib.digested.push(k)); st.lib.ticks.clear(); st.lib.choosing=false; render(); toast(`${n} results digested from the TeX source. Each now waits to be checked against the paper.`); },
  digestone:t=>{ st.lib.digested.push(t.dataset.k); render(); toast('Digested from the TeX source'); },
  yes:t=>{ const key=t.dataset.key;
    if(t.dataset.where==='lib'){ const [wid,num]=key.split(':'); st.lib.compared.push(key); const nx = nextLib(wid,num); st.lib.sel[wid]=nx; render(); toast(`${num} matches the paper${nx?'; the next not compared is open':''}`); }
    else { const [rid,k]=key.split(':'); st.rev.done.add(key); if(k==='a25'){ st.rev.done.add(rid); } else { const nx = SMQ.find(x=>!st.rev.done.has(rid+':'+x)); if(nx) st.rev.sub[rid]=nx; else st.rev.done.add(rid); } render(); toast('Matches the paper; the next is open'); } },
  overlay:()=>{ st.lib.overlay=!st.lib.overlay; st.viewMenu=false; render(); },
  viewmenu:(t,e)=>{ e.stopPropagation(); st.viewMenu = st.viewMenu===t.dataset.w?false:t.dataset.w; render(); },
  annotate:t=>{ st.lib.annotate = st.lib.annotate===t.dataset.w?false:t.dataset.w; render(); },
  mark7:()=>{ st.lib.marked7=true; render(); toast('Marked on page 7, to digest'); },
  rtoggle:t=>{ const id=t.dataset.id; st.rev.open.has(id)?st.rev.open.delete(id):st.rev.open.add(id); if(id==='c1') st.lastSel='s24:l3.2'; render(); },
  subopen:t=>{ st.rev.sub[t.dataset.r]=t.dataset.k; render(); },
  rplain:t=>{ st.rev.plain=t.dataset.v==='1'; render(); },
  answer:t=>{ st.rev.done.add(t.dataset.id); st.rev.open.delete(t.dataset.id); render(); toast('Done'); },
  agents:()=>{ st.rev.agentsOpen=!st.rev.agentsOpen; render(); },
  rfold:t=>{ const k=t.dataset.k; st.rev.folded.has(k)?st.rev.folded.delete(k):st.rev.folded.add(k); render(); },
  deltask:(t,e)=>{ e.stopPropagation(); st.rev.removedTasks.add(t.dataset.id); render(); toast('Task deleted'); },
  fold:t=>{ if(t.dataset.k==='defs') st.foldDefs=!st.foldDefs; else st.foldAux=!st.foldAux; render(); },
  attest:t=>{ st.rev.done.add(t.dataset.id); st.rev.open.delete(t.dataset.id); N['m:l3.3'].st='formal'; render(); toast('Lemma 3.3 attested: it is now formalized'); },
  scope:t=>{ st.web.scope=t.dataset.k; render(); },
  form:t=>{ st.web.form=t.dataset.v; render(); },
  wsort:t=>{ st.web.sort=t.dataset.v; render(); },
  focus:t=>{ const id=t.dataset.id; if(id===st.web.focus) return; st.web.focus=id; st.web.trail.push(id); st.web.trail=st.web.trail.slice(-6); st.web.more=false; render(); },
  trail:t=>{ const i=+t.dataset.i; st.web.trail=st.web.trail.slice(0,i+1); st.web.focus=st.web.trail[i]; render(); },
  more:()=>{ st.web.more=!st.web.more; render(); },
  wide:()=>{ st.web.wide=!st.web.wide; if(st.web.wide) st.web.more=true; if(st.web.form!=='drawn') st.web.form='drawn'; render(); },
  picker:()=>{ st.docs.picker=!st.docs.picker; render(); },
  psort:t=>{ st.docs.sort=t.dataset.v; render(); },
  layout:t=>{ st.docs.layout=t.dataset.v; render(); },
  openbeside:t=>{ st.docs.beside=t.dataset.w; st.docs.picker=false; st.docs.tab='main'; render(); },
  closebeside:()=>{ st.docs.beside=null; render(); },
  notestab:()=>{ st.docs.notesOpen=true; st.docs.tab='notes'; st.docs.picker=false; render(); },
  closenotes:(t,e)=>{ e.stopPropagation(); st.docs.notesOpen=false; st.docs.tab='main'; render(); },
  doctab:t=>{ st.docs.tab=t.dataset.t; render(); },
  gonote:()=>{ st.docs.tab='main'; render(); toast('main.tex, at the note', false); },
  delnote:(t,e)=>{ e.stopPropagation(); st.notesGone=st.notesGone||new Set(); st.notesGone.add(t.dataset.id); render(); toast('Note deleted'); },
  openatplace:()=>{ st.docs.beside='arden24'; st.docs.card=null; st.lastSel='a24:p2.1'; render(); toast('Arden 2024 at page 1, beside the draft', false); },
  probs:(t,e)=>{ e.stopPropagation(); st.docs.probs=!st.docs.probs; render(); },
  toast:(t,e)=>{ e.stopPropagation(); toast(t.dataset.t, false); },
  closeToast:()=>{ st.msg=null; render(); },
  closeMsg:()=>{ st.msg=null; render(); },
  noop:(t,e)=>{ e.stopPropagation(); },
  locate:(t,e)=>{ e.stopPropagation(); const r=t.dataset.r, k=t.dataset.k; st.rev.sub[r] = st.rev.sub[r]===k?null:k; render(); },
  cselect:(t,e)=>{ e.stopPropagation(); st.rev.csel=t.dataset.k; render(); },
  cmark:(t,e)=>{ e.stopPropagation(); st.rev.cmarked.add(t.dataset.k); st.rev.csel=null; render(); toast('Marked on the page, to digest'); },
  askread:(t,e)=>{ e.stopPropagation(); const r=RV.find(x=>x.k==='g').rows.find(x=>x.id===t.dataset.id); st.rev.done.add(r.id); TASKS.push({id:'tr'+r.id, d:r.d, text:'Read '+r.text.replace(' · ',', ')}); render(); toast('Asked an agent to read it. It comes back under To compare.'); },
  readall:(t,e)=>{ e.stopPropagation(); const g=RV.find(x=>x.k==='g'); g.rows.filter(r=>r.cited&&!st.rev.done.has(r.id)).forEach(r=>{ st.rev.done.add(r.id); TASKS.push({id:'tr'+r.id, d:r.d, text:'Read '+r.text.replace(' · ',': ')}); }); render(); toast('Asked an agent to read them. They wait under Waiting for an agent, and come back under To compare.'); },
  name:(t,e)=>{ e.stopPropagation(); st.rev.naming=true; render(); },
  namecancel:(t,e)=>{ e.stopPropagation(); st.rev.naming=false; render(); },
  nameuse:(t,e)=>{ e.stopPropagation(); RV.find(x=>x.k==='g').rows.find(r=>r.id===t.dataset.id).named=true; st.rev.naming=false; render(); },
  nameundo:(t,e)=>{ e.stopPropagation(); delete RV.find(x=>x.k==='g').rows.find(r=>r.id===t.dataset.id).named; render(); },
  askwhich:(t,e)=>{ e.stopPropagation(); st.rev.done.add(t.dataset.id); TASKS.push({id:'tw', d:'main.tex', text:'Say which result of Okafor 2022 the proof of Theorem 3.4 rests on'}); render(); toast('Asked an agent which result it is.'); },
  restate:(t,e)=>{ e.stopPropagation(); toast('Asked an agent to restate it in Lean.'); },
  reattest:(t,e)=>{ e.stopPropagation(); st.rev.done.add(t.dataset.k); st.rev.sub.cat2=null; render(); toast('Attested again.'); },
  fzdocs:(t,e)=>{ e.stopPropagation(); const id=t.dataset.id; const s0=N[id].st; if(s0!=='unformal'){ toast(id==='m:l3.3'?'Lemma 3.3: Lean accepted, not attested. It waits for you in Review.':`${N[id].name}: ${W[s0]}.`, false); return; } st.fz='docs'; st.fzTarget=id; st.fzOpen=new Set(); render(); },
  fzweb:(t,e)=>{ e.stopPropagation(); st.fzWebTargets=null; st.fz = st.fz==='web'?null:'web'; render(); },
  fzclose:(t,e)=>{ e.stopPropagation(); st.fz=null; render(); },
  fzline:(t,e)=>{ e.stopPropagation(); const k=t.dataset.k; st.fzOpen.has(k)?st.fzOpen.delete(k):st.fzOpen.add(k); render(); },
  fzchoose:(t,e)=>{ e.stopPropagation(); const id=t.dataset.id; t.dataset.v==='assume'?st.fzAssume.add(id):st.fzAssume.delete(id); render(); },
  fzask:(t,e)=>{ e.stopPropagation(); if(t.disabled) return; const ts = st.fz==='web' ? (st.fzWebTargets||st.web.picked) : [st.fzTarget]; ts.forEach(i=>TASKS.push({id:'tf'+i, d:'main.tex', text:`Formalize ${N[i].name} of main.tex`})); st.fz=null; render(); toast(`Asked an agent to formalize ${ts.length===1?N[ts[0]].name:ts.length+' results'}. ${ts.length===1?'It waits':'They wait'} in Review, under Waiting for an agent.`); },
  pick:(t,e)=>{ e.stopPropagation(); const id=t.dataset.id; const p=st.web.picked; p.includes(id)?p.splice(p.indexOf(id),1):p.push(id); render(); },
  unpick:()=>{ st.web.picked=[]; st.fz=null; render(); },
  lookyes:(t,e)=>{ e.stopPropagation(); const w=byId('halberd'); w.offlineAsk=null; w.lookingUp=true; w.file='2209.01234v2.pdf'; render(); setTimeout(()=>{ w.lookingUp=false; st.scrollWork='halberd'; toast('Looked up arXiv 2209.01234v2: Gadget towers, Halberd and Ravel 2021, with its TeX source.'); }, 1200); },
  looknot:(t,e)=>{ e.stopPropagation(); byId('halberd').offlineAsk='later'; render(); },
  closerank:(t,e)=>{ e.stopPropagation(); st.docs.rankOpen=false; if(st.docs.tab==='rank') st.docs.tab='main'; render(); },
  digest:(t,e)=>{ e.stopPropagation(); const w=t.dataset.w, sc=t.dataset.scope; st.menu=null;
    if(sc==='choose'){ st.lib.choosing=w; st.lib.ticks.clear(); render(); return; }
    const wk = byId(w); render();
    toast(w==='all' ? (sc==='use' ? 'Digesting 9 results from TeX sources now; 5 more from PDFs wait for an agent.' : `Digesting ${st.lib.multi.size} papers.`) : (wk.holds.includes('TeX') ? 'Digesting from the TeX source, now.' : 'Asked an agent. It waits in Review, under Waiting for an agent.')); },
  liblayout:t=>{ st.lib.layout=t.dataset.v; render(); },
  gosec:t=>{ const w=t.dataset.w, k=t.dataset.s, pg=t.dataset.p; const there = (w==='smith'&&['3','4'].includes(k))||(w==='arden24'&&['1','2'].includes(k));
    if(there){ st.scrollNode=k; render(); } else toast(`Section ${k} begins on page ${pg}. Only ${w==='smith'?'pages 12 and 13 are':w==='okafor'?'pages 6 and 7 are':'page 1 is'} drawn in this mock-up.`, false); },
  seeit:(t,e)=>{ e.stopPropagation(); st.rev.over={doc:t.dataset.doc, env:t.dataset.env||null}; render(); },
  closeover:(t,e)=>{ e.stopPropagation(); st.rev.over=null; render(); },
  mention:(t,e)=>{ e.stopPropagation(); st.rev.done.add(t.dataset.id); render(); toast('Remembered as a mention. It is not asked about again.'); },
  dirfold:(t,e)=>{ e.stopPropagation(); const d=t.dataset.d, ds=st.docs.dirs; ds.has(d)?ds.delete(d):ds.add(d); render(); },
  filestoggle:(t,e)=>{ e.stopPropagation(); st.docs.filesOpen = st.docs.filesOpen===false; st.docs.peek=false; render(); },
  leanmarks:(t,e)=>{ e.stopPropagation(); st.docs.leanMarks = st.docs.leanMarks===false; st.viewMenu=false; render(); },
  fzshow:(t,e)=>{ if(e.target.closest('.seg')) return; const id=t.dataset.id; st.fzShow.has(id)?st.fzShow.delete(id):st.fzShow.add(id); render(); },
  fzdone:()=>{ st.fzDoneOpen=!st.fzDoneOpen; render(); },
  fzfocus:(t,e)=>{ e.stopPropagation(); st.fz='web'; st.fzWebTargets=[t.dataset.id]; render(); },
  wdoc:t=>{ const d=t.dataset.d; const sc=st.web.scope; const def = sc==='deps'; const open = st.web.openDocs.has(d) || (def && !st.web.closedDocs.has(d)); if(open){ st.web.openDocs.delete(d); st.web.closedDocs.add(d); } else { st.web.openDocs.add(d); st.web.closedDocs.delete(d); } render(); },
  hidecol:(t,e)=>{ e.stopPropagation(); st.colFolded=!st.colFolded; render(); },
  agentpanel:(t,e)=>{ e.stopPropagation(); st.agentPanel=!st.agentPanel; render(); },
  rkind:t=>{ st.rev.kind=t.dataset.k; if(t.dataset.k==='all') st.rev.draft='all'; render(); },
  rdraft:t=>{ st.rev.draft = st.rev.draft===t.dataset.d ? 'all' : t.dataset.d; render(); },
  nsort:t=>{ st.docs.nsort=t.dataset.v; render(); },
  orphtoggle:(t,e)=>{ st.docs.showOrph = !(st.docs.showOrph!==false); render(); },
  opendoc:t=>{ const d=t.dataset.t; if(d==='bounds') st.docs.boundsOpen=true; if(d==='rank') st.docs.rankOpen=true; st.docs.tab=d; st.docs.picker=false; render(); },
  closebounds:(t,e)=>{ e.stopPropagation(); st.docs.boundsOpen=false; if(st.docs.tab==='bounds') st.docs.tab='main'; render(); },
};
document.addEventListener('click', e=>{
  if(e.target.closest('[data-notes]')){ notesOpen=!notesOpen; strip(); notesPanel(); return; }
  const s=e.target.closest('[data-s]'); if(s){ go(s.dataset.s); return; }
  const a=e.target.closest('[data-act]');
  if(a){ ACTS[a.dataset.act]?.(a,e); return; }
  if(st.menu||st.viewMenu||st.legend||st.docs.probs||st.agentPanel){ if(!e.target.closest('.menu,.legend-pop,.agentpop')){ st.menu=null; st.viewMenu=false; st.legend=false; st.docs.probs=false; st.agentPanel=false; render(); } }
});
let tipT=null;
document.addEventListener('mouseover', e=>{ const v=e.target.closest('[data-tip]'); if(v){ if(st.viewTip!==v.dataset.tip){ clearTimeout(tipT); const k=v.dataset.tip; tipT=setTimeout(()=>{ st.viewTip=k; render(); }, 600); } } else if(st.viewTip||tipT){ clearTimeout(tipT); tipT=null; if(st.viewTip){ st.viewTip=null; render(); } } });
document.addEventListener('mouseover', e=>{ if(st.view!=='docs') return; const c=e.target.closest('.cite[data-c]');
  if(c){ if(st.docs.card!==c.dataset.c){ st.docs.card=c.dataset.c; render(); } return; }
  if(st.docs.card && e.target.closest('.docin') && !e.target.closest('.hcard')){ st.docs.card=null; render(); } });
document.addEventListener('change', e=>{ if(e.target.matches('select[data-act="draft"]')){ st.web.draft=e.target.value; render(); } });
document.addEventListener('input', e=>{ const k=e.target.dataset.input; if(!k) return; const v=e.target.value, p=e.target.selectionStart;
  if(k==='libq') st.lib.q=v; else if(k==='webq') st.web.q=v; else if(k==='pq') st.docs.pq=v; render(); const i=document.querySelector(`[data-input="${k}"]`); if(i){ i.focus(); i.setSelectionRange(p,p); } });
/* a real drop: the overlay while a file is above the window, then a row that looks itself up */
let dragDepth=0;
window.addEventListener('dragenter', e=>{ if(!e.dataTransfer?.types?.includes('Files')) return; e.preventDefault(); dragDepth++; if(!st.dragging){ st.dragging=true; render(); } });
window.addEventListener('dragover', e=>{ if(e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave', ()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth){ st.dragging=false; render(); } });
window.addEventListener('drop', e=>{ e.preventDefault(); dragDepth=0; st.dragging=false; const f = e.dataTransfer.files[0];
  if(st.view==='review'){ toast(`Filed ${f?esc(f.name):'the paper'} with Jones 2019, which an agent was waiting for.`); return; }
  const w = byId('halberd'); w.lookingUp=true; w.file=f?f.name:'2209.01234v2.pdf'; st.lib.added=true;
  const here = st.view==='library' && st.lib.tab==='works';
  if(here){ st.lib.selWork='halberd'; st.scrollWork='halberd'; }
  render();
  setTimeout(()=>{ w.lookingUp=false; if(here){ st.lib.selWork='halberd'; st.scrollWork='halberd'; } toast('Added Gadget towers, Halberd and Ravel 2021, found by its arXiv number, with its TeX source.'); }, 1400); });
const start=(location.hash||'#s1').slice(1);
go(SCREENS.some(x=>x[0]===start)?start:'s1');
if(new URLSearchParams(location.search).has('notes')){ notesOpen=true; strip(); notesPanel(); }
</script>
</body>
</html>
