[project]
name = "loomtex"
version = "0.1.0.dev0"
description = "loom: a tool for atomized mathematical research in LaTeX"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ikmartin" }]
keywords = ["latex", "mathematics", "writing", "review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "click>=8.1",
  "markdown-it-py>=3.0",
  "mcp>=2.3,<3",
]

[project.scripts]
loom = "loom.cli:main"

[project.urls]
Repository = "https://github.com/ikmartin/loom"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A run's temporary folder is kept only where a test failed, and only the last run's: each holds copies of the example quilts, and several lanes at once had filled the disk with the three runs pytest keeps by default.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
  "tex: needs a real TeX distribution (TeX tier)",
  "lean: needs the Lean toolchain loom pins, installed under elan's home, and the fence up (Lean tier)",
  "poppler: needs the real pdftotext for page text and word boxes; TeX stays the shim",
  "paper: needs LOOM_PAPER_FIXTURES pointing at the arXiv sources (paper tier)",
  "network: needs network access",
  "tree: compares the working tree with git, or a committed generated file with what its generator writes; run before a merge and on main, not in the everyday lane",
  "client: runs the real Claude Code against a quilt's generated agent configuration, calling a hosted model on the account of whoever runs it; needs LOOM_CLIENT_TESTS=1 and claude on PATH (client tier)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/tools"]  # kept as written elsewhere: the dialect validator vendored from the workspace specs, and the v0.1 study's anchoring harness

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # prose is never hard-wrapped (workspace CLAUDE.md); ruff format governs code width

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
